openapi: 3.0.3
info:
  title: Openyield
  version: 0.1.0
  description: >-
    Open-data product operations API for prioritising high-value datasets, versioned
    licensed releases, privacy gates, re-user support, and downstream yield attestations.
  x-product-slug: ai-gov-openyield
  x-source: ai-in-gov/Accenture-Open-Data-Executive-Summary/
servers:
  - url: https://api.example.com
tags:
  - name: Datasets
    description: Dataset catalogue and prioritisation
  - name: Releases
    description: Versioned distributions and licences
  - name: Privacy
    description: Linkage-risk privacy reviews and suppressions
  - name: Reusers
    description: Re-user orgs, projects, and support tickets
  - name: Yield
    description: Downstream economic and civic yield attestations
  - name: Quality
    description: Freshness and schema-stability SLAs
  - name: Insights
    description: Agency-published insight products
paths:
  /v1/datasets:
    get:
      operationId: listDatasets
      tags: [Datasets]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: highValue
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDataset"
    post:
      operationId: createDataset
      tags: [Datasets]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetCreate"
      responses:
        "201":
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDataset"
  /v1/datasets/{datasetId}:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      operationId: getDataset
      tags: [Datasets]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDataset"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/datasets/{datasetId}/priority:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      operationId: scoreDatasetPriority
      tags: [Datasets]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriorityScore"
      responses:
        "201":
          description: Priority scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePriorityScore"
  /v1/datasets/{datasetId}/versions:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      operationId: createDatasetVersion
      tags: [Releases]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetVersionCreate"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDatasetVersion"
  /v1/versions/{versionId}/distributions:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: publishDistribution
      tags: [Releases]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributionCreate"
      responses:
        "201":
          description: Distribution published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDistribution"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/versions/{versionId}/schema-diff:
    parameters:
      - $ref: "#/components/parameters/VersionId"
    post:
      operationId: registerSchemaDiff
      tags: [Releases]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaDiff"
      responses:
        "201":
          description: Schema diff registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSchemaDiff"
  /v1/privacy/reviews:
    get:
      operationId: listPrivacyReviews
      tags: [Privacy]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Privacy reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopePrivacyReview"
    post:
      operationId: createPrivacyReview
      tags: [Privacy]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyReviewCreate"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePrivacyReview"
  /v1/privacy/suppressions:
    post:
      operationId: suppressDistribution
      tags: [Privacy]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuppressionEventCreate"
      responses:
        "202":
          description: Suppression accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSuppressionEvent"
  /v1/reusers:
    get:
      operationId: listReuserOrgs
      tags: [Reusers]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Re-user orgs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeReuserOrg"
    post:
      operationId: registerReuserOrg
      tags: [Reusers]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReuserOrgCreate"
      responses:
        "201":
          description: Org registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReuserOrg"
  /v1/reusers/projects:
    get:
      operationId: listReuserProjects
      tags: [Reusers]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeReuserProject"
    post:
      operationId: registerReuserProject
      tags: [Reusers]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReuserProjectCreate"
      responses:
        "201":
          description: Project registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReuserProject"
  /v1/support/tickets:
    get:
      operationId: listSupportTickets
      tags: [Reusers]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSupportTicket"
    post:
      operationId: createSupportTicket
      tags: [Reusers]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketCreate"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSupportTicket"
  /v1/yield/attestations:
    get:
      operationId: listYieldAttestations
      tags: [Yield]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Yield attestations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeYieldAttestation"
    post:
      operationId: createYieldAttestation
      tags: [Yield]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YieldAttestationCreate"
      responses:
        "201":
          description: Attestation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeYieldAttestation"
  /v1/quality/metrics:
    get:
      operationId: listQualityMetrics
      tags: [Quality]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: datasetId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Quality metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeQualityMetric"
    post:
      operationId: recordQualityMetric
      tags: [Quality]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityMetric"
      responses:
        "201":
          description: Metric recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQualityMetric"
  /v1/insights:
    get:
      operationId: listInsightProducts
      tags: [Insights]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Insight products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeInsightProduct"
    post:
      operationId: publishInsightProduct
      tags: [Insights]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightProductCreate"
      responses:
        "201":
          description: Insight published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInsightProduct"
components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: { type: string }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Agency:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Steward:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    Dataset:
      type: object
      required: [id, title, stewardId, accessTier]
      properties:
        id: { type: string }
        title: { type: string }
        stewardId: { type: string }
        highValue: { type: boolean }
        updateCadence: { type: string }
        accessTier:
          type: string
          enum: [open, registered, restricted]
        status:
          type: string
          enum: [draft, published, suppressed, retired]
    DatasetCreate:
      type: object
      required: [title, stewardId, accessTier]
      properties:
        title: { type: string }
        stewardId: { type: string }
        updateCadence: { type: string }
        accessTier:
          type: string
          enum: [open, registered, restricted]
    PriorityScore:
      type: object
      required: [id, datasetId, score]
      properties:
        id: { type: string }
        datasetId: { type: string }
        score: { type: number }
        reuserDemand: { type: number }
        uniqueHolding: { type: number }
        economicPotential: { type: number }
        stakeholderInputRef: { type: string }
    DatasetVersion:
      type: object
      required: [id, datasetId, version, schemaVersion]
      properties:
        id: { type: string }
        datasetId: { type: string }
        version: { type: string }
        schemaVersion: { type: string }
        releasedAt: { type: string, format: date-time }
    DatasetVersionCreate:
      type: object
      required: [version, schemaVersion]
      properties:
        version: { type: string }
        schemaVersion: { type: string }
        changeNotes: { type: string }
        compatibilityWindowDays: { type: integer }
    Licence:
      type: object
      required: [id, spdxOrName, attributionRequired]
      properties:
        id: { type: string }
        spdxOrName: { type: string }
        attributionRequired: { type: boolean }
        url: { type: string, format: uri }
    Distribution:
      type: object
      required: [id, versionId, licenceId, format, accessUrl]
      properties:
        id: { type: string }
        versionId: { type: string }
        licenceId: { type: string }
        format: { type: string }
        accessUrl: { type: string, format: uri }
        byteSize: { type: integer }
    DistributionCreate:
      type: object
      required: [licenceId, format, accessUrl]
      properties:
        licenceId: { type: string }
        format: { type: string }
        accessUrl: { type: string, format: uri }
        privacyReviewId: { type: string }
        byteSize: { type: integer }
    SchemaDiff:
      type: object
      required: [id, versionId, breaking, noticeLeadDays]
      properties:
        id: { type: string }
        versionId: { type: string }
        breaking: { type: boolean }
        noticeLeadDays: { type: integer }
        summary: { type: string }
    PrivacyReview:
      type: object
      required: [id, datasetId, outcome]
      properties:
        id: { type: string }
        datasetId: { type: string }
        versionId: { type: string }
        linkageRisk: { type: string }
        outcome:
          type: string
          enum: [approved, rejected, conditional]
        reviewerId: { type: string }
    PrivacyReviewCreate:
      type: object
      required: [datasetId, linkageRisk, outcome, reviewerId]
      properties:
        datasetId: { type: string }
        versionId: { type: string }
        linkageRisk: { type: string }
        outcome:
          type: string
          enum: [approved, rejected, conditional]
        reviewerId: { type: string }
        conditions: { type: string }
    ReuserOrg:
      type: object
      required: [id, name, sector]
      properties:
        id: { type: string }
        name: { type: string }
        sector:
          type: string
          enum: [business, nonprofit, academia, other]
    ReuserOrgCreate:
      type: object
      required: [name, sector]
      properties:
        name: { type: string }
        sector:
          type: string
          enum: [business, nonprofit, academia, other]
        contactEmail: { type: string, format: email }
    ReuserProject:
      type: object
      required: [id, orgId, title, datasetIds]
      properties:
        id: { type: string }
        orgId: { type: string }
        title: { type: string }
        datasetIds:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [active, completed, abandoned]
    ReuserProjectCreate:
      type: object
      required: [orgId, title, datasetIds]
      properties:
        orgId: { type: string }
        title: { type: string }
        datasetIds:
          type: array
          items: { type: string }
        description: { type: string }
    SupportTicket:
      type: object
      required: [id, datasetId, subject, status]
      properties:
        id: { type: string }
        datasetId: { type: string }
        orgId: { type: string }
        subject: { type: string }
        status:
          type: string
          enum: [open, in_progress, closed]
    SupportTicketCreate:
      type: object
      required: [datasetId, subject]
      properties:
        datasetId: { type: string }
        orgId: { type: string }
        subject: { type: string }
        body: { type: string }
    YieldAttestation:
      type: object
      required: [id, projectId, outcomeType, summary]
      properties:
        id: { type: string }
        projectId: { type: string }
        outcomeType:
          type: string
          enum: [product_launched, cost_saved, insight_applied, other]
        summary: { type: string }
        quantifiedValue: { type: number }
        currency: { type: string }
        verified: { type: boolean }
    YieldAttestationCreate:
      type: object
      required: [projectId, outcomeType, summary]
      properties:
        projectId: { type: string }
        outcomeType:
          type: string
          enum: [product_launched, cost_saved, insight_applied, other]
        summary: { type: string }
        quantifiedValue: { type: number }
        currency: { type: string }
    QualityMetric:
      type: object
      required: [id, datasetId, metricType, value, measuredAt]
      properties:
        id: { type: string }
        datasetId: { type: string }
        metricType:
          type: string
          enum: [timeliness_hours, completeness, schema_break_rate]
        value: { type: number }
        slaBreached: { type: boolean }
        measuredAt: { type: string, format: date-time }
    InsightProduct:
      type: object
      required: [id, title, sourceDatasetIds]
      properties:
        id: { type: string }
        title: { type: string }
        sourceDatasetIds:
          type: array
          items: { type: string }
        summary: { type: string }
        publishedAt: { type: string, format: date-time }
    InsightProductCreate:
      type: object
      required: [title, sourceDatasetIds, summary]
      properties:
        title: { type: string }
        sourceDatasetIds:
          type: array
          items: { type: string }
        summary: { type: string }
    AccessTier:
      type: object
      required: [datasetId, tier]
      properties:
        datasetId: { type: string }
        tier:
          type: string
          enum: [open, registered, restricted]
    SuppressionEvent:
      type: object
      required: [id, distributionId, reason, status]
      properties:
        id: { type: string }
        distributionId: { type: string }
        reason: { type: string }
        successorDatasetId: { type: string }
        status:
          type: string
          enum: [accepted, completed]
        notifyReusers: { type: boolean }
    SuppressionEventCreate:
      type: object
      required: [distributionId, reason]
      properties:
        distributionId: { type: string }
        reason: { type: string }
        successorDatasetId: { type: string }
        notifyReusers: { type: boolean }

    DataEnvelopeDataset:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Dataset"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeDataset:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dataset"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopePriorityScore:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/PriorityScore"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopePriorityScore:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PriorityScore"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeDatasetVersion:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DatasetVersion"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeDatasetVersion:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DatasetVersion"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeDistribution:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Distribution"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeDistribution:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Distribution"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeSchemaDiff:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SchemaDiff"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeSchemaDiff:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SchemaDiff"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopePrivacyReview:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/PrivacyReview"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopePrivacyReview:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PrivacyReview"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeSuppressionEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/SuppressionEvent"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeSuppressionEvent:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SuppressionEvent"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeReuserOrg:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ReuserOrg"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeReuserOrg:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
